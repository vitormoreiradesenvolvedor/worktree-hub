[package]
name = "worktree-hub"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Orquestrador grafico de git worktrees com multiterminal integrado"
license = "MIT"
authors = ["Vitor Moreira"]
readme = "README.md"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false, features = ["wayland-data-control"] }
directories = "6.0.0"
# The glow (OpenGL) backend instead of wgpu: a paint callback can then clear a
# rectangle of the framebuffer, which is what makes the terminals see-through.
eframe = { version = "0.37.0", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "system_fonts",
    "wayland",
    "x11",
] }
egui = "0.37.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-width = "0.2.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
